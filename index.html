<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="graffitiRough" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.06" numOctaves="2" seed="7" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="10" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div id="install-bar" class="install-bar hidden"><span>Installer l'application sur cet appareil</span><button id="install-btn" type="button">Installer</button></div>
<main id="root"></main>
<script src="sync-config.js"></script>
<script>
const STORAGE_KEY = 'carrieres-fifa16-data-v1';
const GITHUB_TOKEN_KEY = 'carrieres-fifa16-github-token';
const HAD_SAVED_STATE = !!localStorage.getItem(STORAGE_KEY);
const defaults = { updatedAt: new Date().toISOString(), players: [emptyPlayer('Nouveau joueur')] };
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function emptyYear(){ return { id: uid(), age: '', club: '', niveau: '', potentiel: '', potentielDelta: '', matches: '', buts: '', pd: '', note: '', bonus: '', objectif: '', contrat: '' }; }
function emptyGoal(text){ return { id: uid(), text: text || '', completed: false }; }
function emptyPlayer(name){ return { id: uid(), name, position: '', number: '27', currentClub: '', currentLeague: '', dreamClub: '', dreamLeague: '', goals: [emptyGoal('')], years: [emptyYear()] }; }
function emptyClubRecord(name, matches, goals, assists){ return { id: uid(), name: name || '', matches: matches != null ? String(matches) : '', goals: goals != null ? String(goals) : '', assists: assists != null ? String(assists) : '' }; }
const CLUB_RECORDS_SEED = [
  ['Jesús María Satrústegui', 314, 143, null],
  ['Mikel Oyarzabal', 438, 133, 65],
  ['Darko Kovačević', 284, 107, 22],
  ['Roberto López Ufarte', 381, 103, null],
  ['Meho Kodro', 144, 81, null],
  ['Carlos Vela', 250, 73, 43],
  ['Imanol Agirretxe', 271, 74, 16],
  ['Xabi Prieto', 531, 74, 52],
  ['José María Bakero', 239, 68, null],
  ['Uralde', 196, 67, null],
  ['Jesús Zamora', 488, 65, null],
  ['Willian José', 170, 62, 15],
  ['Igoa', 116, 60, null],
  ['De Paula', 300, 60, null],
  ['Nihat Kahveci', 142, 57, null],
  ['Paz', 227, 56, null],
  ['Cholín', 95, 53, null],
  ['Antoine Griezmann', 202, 52, 18],
  ['Javi de Pedro', 325, 52, 38],
  ['Epi', 135, 46, null],
  ['Rubén Pardo', 194, 7, 34],
  ['Aitor López Rekarte', 337, 4, 30],
  ['Mikel Merino', 242, 27, 30],
  ['Brais Méndez', 166, 33, 24],
  ['David Zurutuza', 303, 22, 22],
  ['Adnan Januzaj', 168, 23, 22],
  ['Takefusa Kubo', 165, 25, 22],
  ['Sergio Canales', 161, 13, 22],
  ['Agustín Aranzabal', 351, 5, 19],
  ['Ander Barrenetxea', 235, 28, 18],
  ['David Silva', 93, 7, 18],
  ['Asier Illarramendi', 253, 11, 17],
  ['Chory Castro', 116, 12, 17],
  ['Alberto de la Bella', 219, 8, 16],
  ['Carlos Martínez', 209, 4, 16],
  ['Portu', 137, 18, 16],
  ['Xabi Alonso', 124, 10, 13]
];
function loadState(){
  try{ const stored = JSON.parse(localStorage.getItem(STORAGE_KEY)); if(stored && Array.isArray(stored.players) && stored.players.length) return normalizePayload(stored); }catch(err){}
  return normalizePayload(defaults);
}
function normalizePayload(payload){
  const players = (payload.players || []).map((player) => ({
    id: player.id || uid(), name: player.name || 'Joueur', position: player.position || '', number: player.number || '27', currentClub: player.currentClub || '', currentLeague: player.currentLeague || '', dreamClub: player.dreamClub || '', dreamLeague: player.dreamLeague || '',
    goals: Array.isArray(player.goals) && player.goals.length ? player.goals.map((goal) => ({ id: goal.id || uid(), text: goal.text || '', completed: !!goal.completed })) : [emptyGoal('')],
    years: Array.isArray(player.years) && player.years.length ? player.years.map((year) => ({ ...emptyYear(), ...year, id: year.id || uid() })) : [emptyYear()]
  }));
  let clubsData;
  if (payload.clubsData && typeof payload.clubsData === 'object' && Object.keys(payload.clubsData).length){
    clubsData = {};
    Object.keys(payload.clubsData).forEach((clubName) => {
      const arr = payload.clubsData[clubName];
      clubsData[clubName] = Array.isArray(arr) ? arr.map((rec) => ({ id: rec.id || uid(), name: rec.name || '', matches: rec.matches ?? '', goals: rec.goals ?? '', assists: rec.assists ?? '' })) : [];
    });
  } else if (Array.isArray(payload.clubRecords) && payload.clubRecords.length){
    clubsData = { 'Real Sociedad': payload.clubRecords.map((rec) => ({ id: rec.id || uid(), name: rec.name || '', matches: rec.matches ?? '', goals: rec.goals ?? '', assists: rec.assists ?? '' })) };
  } else {
    clubsData = { 'Real Sociedad': CLUB_RECORDS_SEED.map(([name, matches, goals, assists]) => emptyClubRecord(name, matches, goals, assists)) };
  }
  return { updatedAt: payload.updatedAt || new Date().toISOString(), playerId: payload.playerId || (players[0] && players[0].id), players: players.length ? players : defaults.players, clubsData, activePalmaresClub: (payload.activePalmaresClub || '').trim() || 'Real Sociedad' };
}
let state = loadState();
const PALMARES = {
  club: 'Real Sociedad',
  sourceButeurs: 'Historique initial : mondefootball.fr / Transfermarkt. Modifiable ci-dessous (transferts, regens, progression des pros).',
  sourcePasseurs: 'Historique initial : Transfermarkt. Modifiable ci-dessous (transferts, regens, progression des pros).',
  buteursLimit: 20,
  passeursLimit: 25
};
function currentPlayer(){ return state.players.find((player) => player.id === state.playerId) || state.players[0]; }
function getPayload(){ return { updatedAt: state.updatedAt, playerId: state.playerId, players: state.players, clubsData: state.clubsData, activePalmaresClub: state.activePalmaresClub }; }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(getPayload())); }
function touch(){ state.updatedAt = new Date().toISOString(); save(); }
function esc(value){ return String(value ?? '').replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char])); }
function num(value){ const parsed = Number(String(value ?? '').replace(',', '.')); return Number.isFinite(parsed) ? parsed : 0; }
function ratingColor(r){ if(!r) return 'var(--text)'; if(r >= 8.5) return 'var(--gold)'; if(r >= 7) return 'var(--green)'; if(r >= 6) return 'var(--text-secondary)'; return 'var(--red)'; }
function total(field){ return currentPlayer().years.reduce((sum, year) => sum + num(year[field]), 0); }
function avgNote(){ const notes = currentPlayer().years.map((year) => num(year.note)).filter(Boolean); return notes.length ? (notes.reduce((sum, note) => sum + note, 0) / notes.length).toFixed(1) : '0'; }
function initials(name){ return String(name || 'J').split(/\s+/).filter(Boolean).slice(0, 2).map((part) => part[0]).join('').toUpperCase(); }
function render(){
  const player = currentPlayer();

let palmaresManagerOpen = false;
function computeViewClub(){ return (state.activePalmaresClub || '').trim() || 'Real Sociedad'; }
function clubMatches(yearClub, clubName){
  if (!yearClub || !clubName) return false;
  const a = String(yearClub).toLowerCase().trim(); const b = String(clubName).toLowerCase().trim();
  if (!a || !b) return false;
  return a.includes(b) || b.includes(a);
}
function sumFieldForClub(player, field, clubName){ return player.years.filter((y) => clubMatches(y.club, clubName)).reduce((sum, y) => sum + num(y[field]), 0); }
function getClubRecords(clubName){ if (!state.clubsData[clubName]) state.clubsData[clubName] = []; return state.clubsData[clubName]; }
function clubRecordRows(clubName){
  return getClubRecords(clubName).map((r) => ({ id: r.id, name: r.name || '(sans nom)', matches: num(r.matches), goals: num(r.goals), assists: num(r.assists), isPlayer: false }));
}
function trackedPlayerRowsForClub(clubName, alwaysIncludeId){
  return state.players.map((p) => ({ id: 'tracked-' + p.id, playerId: p.id, name: p.name || 'Joueur', matches: sumFieldForClub(p, 'matches', clubName), goals: sumFieldForClub(p, 'buts', clubName), assists: sumFieldForClub(p, 'pd', clubName), isPlayer: true }))
    .filter((r) => r.matches > 0 || r.goals > 0 || r.assists > 0 || r.id === alwaysIncludeId);
}
function topRanking(rows, statKey, limit){
  const sorted = rows.slice().sort((a, b) => b[statKey] - a[statKey]);
  let rank = 1;
  const ranked = sorted.map((row, i) => {
    if (i > 0 && sorted[i][statKey] < sorted[i - 1][statKey]) rank = i + 1;
    return Object.assign({}, row, { rank });
  });
  return ranked.slice(0, limit);
}
function palmaresCard(){
  const viewClub = computeViewClub();
  const currentId = 'tracked-' + currentPlayer().id;
  const trackedRows = trackedPlayerRowsForClub(viewClub, currentId);
  const allRows = clubRecordRows(viewClub).concat(trackedRows);
  const buteursTop = topRanking(allRows, 'goals', PALMARES.buteursLimit);
  const passeursTop = topRanking(allRows, 'assists', PALMARES.passeursLimit);

  const rowLabel = (p) => p.isPlayer ? `<span class="palmares-tag">${p.id === currentId ? 'Toi' : 'Suivi'}</span>` : '';
  const rowClass = (p) => p.isPlayer ? 'palmares-you' : '';

  const buteursRows = buteursTop.length ? buteursTop.map((p) => `<li class="${rowClass(p)}"><span class="palmares-rank">${p.rank}</span><div class="palmares-info"><span class="palmares-name">${esc(p.name)}${rowLabel(p)}</span><span class="palmares-sub">${p.matches} matchs</span></div><span class="palmares-goals">${p.goals}</span></li>`).join('') : `<li class="palmares-empty">Aucune donnée pour ${esc(viewClub)} pour l'instant.</li>`;
  const passeursRows = passeursTop.length ? passeursTop.map((p) => `<li class="${rowClass(p)}"><span class="palmares-rank">${p.rank}</span><div class="palmares-info"><span class="palmares-name">${esc(p.name)}${rowLabel(p)}</span><span class="palmares-sub">${p.matches} matchs · ${p.goals} buts</span></div><span class="palmares-goals">${p.assists}</span></li>`).join('') : `<li class="palmares-empty">Aucune donnée pour ${esc(viewClub)} pour l'instant.</li>`;

  const currentRow = trackedRows.find((r) => r.id === currentId);
  const inButeurs = buteursTop.some((p) => p.id === currentId);
  const inPasseurs = passeursTop.some((p) => p.id === currentId);
  const buteursLast = buteursTop[buteursTop.length - 1];
  const passeursLast = passeursTop[passeursTop.length - 1];
  const buteursCallout = (currentRow && !inButeurs) ? `<div class="palmares-callout"><div class="palmares-callout-title">Ta progression — Buteurs (${esc(viewClub)})</div><div class="palmares-callout-text"><span class="palmares-callout-value">${esc(currentRow.name)}</span> : ${currentRow.matches} matchs, <span class="palmares-callout-value">${currentRow.goals} but${currentRow.goals > 1 ? 's' : ''}</span>. Il te manque <span class="palmares-callout-value">${buteursLast.goals - currentRow.goals + 1}</span> but${(buteursLast.goals - currentRow.goals + 1) > 1 ? 's' : ''} pour entrer dans le Top ${PALMARES.buteursLimit} (actuellement ${buteursLast.rank}e avec ${buteursLast.goals}).</div></div>` : '';
  const passeursCallout = (currentRow && !inPasseurs) ? `<div class="palmares-callout"><div class="palmares-callout-title">Ta progression — Passeurs (${esc(viewClub)})</div><div class="palmares-callout-text"><span class="palmares-callout-value">${esc(currentRow.name)}</span> : ${currentRow.matches} matchs, <span class="palmares-callout-value">${currentRow.assists} passe${currentRow.assists > 1 ? 's' : ''} d.</span>. Il te manque <span class="palmares-callout-value">${passeursLast.assists - currentRow.assists + 1}</span> passe${(passeursLast.assists - currentRow.assists + 1) > 1 ? 's' : ''} pour entrer dans le Top ${PALMARES.passeursLimit} (actuellement ${passeursLast.rank}e avec ${passeursLast.assists}).</div></div>` : '';

  const clubRecordsForView = getClubRecords(viewClub);
  const managerRows = clubRecordsForView.map((r) => `<div class="clubrec-row" data-id="${esc(r.id)}"><div class="clubrec-line1"><input class="cell-input clubrec-name" data-field="name" value="${esc(r.name)}" placeholder="Nom du joueur"><button class="del-btn" data-action="delete-clubrec" data-id="${esc(r.id)}" aria-label="Supprimer">x</button></div><div class="clubrec-line2"><div class="clubrec-field"><span class="clubrec-label">Matchs</span><input class="cell-input mono" type="number" min="0" data-field="matches" value="${esc(r.matches)}"></div><div class="clubrec-field"><span class="clubrec-label">Buts</span><input class="cell-input mono" type="number" min="0" data-field="goals" value="${esc(r.goals)}"></div><div class="clubrec-field"><span class="clubrec-label">Passes D.</span><input class="cell-input mono" type="number" min="0" data-field="assists" value="${esc(r.assists)}"></div></div></div>`).join('');
  const managerSection = palmaresManagerOpen ? `<div class="palmares-manager"><div class="palmares-manager-hint">${clubRecordsForView.length} joueur(s) enregistré(s) pour ${esc(viewClub)}. Ajoute ici les transferts, regens ou mets à jour les stats des pros (ex: Mbappé, Vinicius) au fil de ta partie. Astuce : le club de chaque saison dans "Progression" doit correspondre au nom du club ci-dessus pour que tes stats comptent dans le bon palmarès.</div><input id="palmares-search-input" class="cell-input palmares-search" type="text" placeholder="Rechercher un joueur..."><div id="palmares-rows-wrap">${managerRows}</div><div class="add-row-bar"><button class="add-btn" data-action="add-clubrec">+ Ajouter un joueur</button></div></div>` : '';

  const currentClubVal = (currentPlayer().currentClub || '').trim();
  const syncBtn = currentClubVal && currentClubVal.toLowerCase() !== viewClub.toLowerCase() ? `<button class="link-btn palmares-sync" data-action="sync-palmares-club">↻ Utiliser le club actuel de ${esc(currentPlayer().name)} (${esc(currentClubVal)})</button>` : '';
  const clubSwitch = `<div class="palmares-club-switch"><span class="clubrec-label">Club affiché</span><input id="palmares-club-input" class="cell-input" value="${esc(viewClub)}"></div>${syncBtn}`;

  return `<section class="card palmares-card"><div class="card-head"><span class="dot" style="background:var(--gold)"></span><div class="card-title">Palmares historique — ${esc(viewClub)}</div></div><div class="card-body">
    ${clubSwitch}
    <div class="palmares-subtitle">⚽ Meilleurs buteurs (Top ${PALMARES.buteursLimit})</div><ul class="palmares-list">${buteursRows}</ul>${buteursCallout}
    <div class="palmares-subtitle">🎯 Meilleurs passeurs (Top ${PALMARES.passeursLimit})</div><ul class="palmares-list">${passeursRows}</ul>${passeursCallout}
    <button class="add-btn palmares-toggle" data-action="toggle-palmares-manager">${palmaresManagerOpen ? 'Masquer' : 'Gérer'} les statistiques du club</button>
    ${managerSection}
  </div></section>`;
}
function yearRow(y){
  return `<tr data-year-id="${esc(y.id)}"><td class="col-age"><input class="cell-input mono" type="number" min="0" data-field="age" value="${esc(y.age)}" placeholder="16"></td><td class="col-club"><input class="cell-input" data-field="club" value="${esc(y.club)}" placeholder="Club"></td><td class="col-niveau"><input class="cell-input mono" type="number" min="0" data-field="niveau" value="${esc(y.niveau)}" placeholder="0"></td><td class="col-matchs"><input class="cell-input mono" type="number" min="0" data-field="matches" value="${esc(y.matches)}" placeholder="0"></td><td class="col-buts"><input class="cell-input mono" type="number" min="0" data-field="buts" value="${esc(y.buts)}" placeholder="0"></td><td class="col-pd"><input class="cell-input mono" type="number" min="0" data-field="pd" value="${esc(y.pd)}" placeholder="0"></td><td class="col-note note-cell" style="color:${ratingColor(num(y.note))}"><input class="cell-input mono" type="number" min="0" max="10" step="0.1" data-field="note" value="${esc(y.note)}" placeholder="0"></td><td class="col-bonus"><input class="cell-input" style="text-align:left" data-field="bonus" value="${esc(y.bonus)}" placeholder="Champion D4, Promu..."></td><td class="del-cell"><button class="del-btn" data-action="delete-year" data-id="${esc(y.id)}" aria-label="Supprimer la saison">x</button></td></tr>`;
}
function goalRow(goal){ return `<div class="goal-row ${goal.completed ? 'done' : ''}" data-goal-id="${esc(goal.id)}"><input class="goal-check" type="checkbox" data-field="goal-completed" ${goal.completed ? 'checked' : ''}><div class="goal-icon">◆</div><textarea class="goal-text" data-field="goal-text" rows="2" placeholder="Objectif">${esc(goal.text)}</textarea><button class="goal-del" data-action="delete-goal" data-id="${esc(goal.id)}">x</button></div>`; }
function attachEvents(){
  const root = document.getElementById('root'); const syncStatus = root.querySelector('#sync-status');
  root.querySelector('[data-action="export-data"]').addEventListener('click', exportData);
  root.querySelector('[data-action="publish-shared"]').addEventListener('click', (event) => publishClick(event, syncStatus));
  root.querySelector('[data-action="forget-token"]').addEventListener('click', () => { localStorage.removeItem(GITHUB_TOKEN_KEY); syncStatus.textContent = 'Token oublie sur cet appareil.'; syncStatus.className = 'sync-status ok'; });
  root.querySelector('[data-action="load-from-repo"]').addEventListener('click', loadFromRepo);
  root.querySelector('#import-file-input').addEventListener('change', importData);
  root.querySelectorAll('[data-action="select-player"]').forEach((el) => el.addEventListener('click', () => { state.playerId = el.dataset.id; save(); render(); }));
  root.querySelector('[data-action="add-player"]').addEventListener('click', () => { const player = emptyPlayer(`Joueur ${state.players.length + 1}`); state.players.push(player); state.playerId = player.id; touch(); render(); });
  root.querySelector('[data-action="delete-player"]').addEventListener('click', () => { if(state.players.length <= 1) return; state.players = state.players.filter((player) => player.id !== state.playerId); state.playerId = state.players[0].id; touch(); render(); });
  bindPlayerInput('#player-name-input','name'); bindPlayerInput('#player-position-input','position'); bindPlayerInput('#player-number-input','number');
  root.querySelector('[data-action="add-year"]').addEventListener('click', () => { currentPlayer().years.push(emptyYear()); touch(); render(); });
  root.querySelectorAll('tbody tr[data-year-id]').forEach((tr) => { const year = currentPlayer().years.find((item) => item.id === tr.dataset.yearId); tr.querySelectorAll('[data-field]').forEach((input) => { input.addEventListener('input', () => { year[input.dataset.field] = input.value; touch(); }); input.addEventListener('change', () => { year[input.dataset.field] = input.value; touch(); render(); }); }); });
  root.querySelectorAll('[data-action="delete-year"]').forEach((el) => el.addEventListener('click', () => { currentPlayer().years = currentPlayer().years.filter((year) => year.id !== el.dataset.id); if(!currentPlayer().years.length) currentPlayer().years.push(emptyYear()); touch(); render(); }));
  root.querySelector('[data-action="add-goal"]').addEventListener('click', () => { currentPlayer().goals.push(emptyGoal('')); touch(); render(); });
  root.querySelectorAll('.goal-row').forEach((row) => { const goal = currentPlayer().goals.find((item) => item.id === row.dataset.goalId); row.querySelector('[data-field="goal-text"]').addEventListener('input', (event) => { goal.text = event.target.value; touch(); }); row.querySelector('[data-field="goal-completed"]').addEventListener('change', (event) => { goal.completed = event.target.checked; touch(); render(); }); });
  root.querySelectorAll('[data-action="delete-goal"]').forEach((el) => el.addEventListener('click', () => { currentPlayer().goals = currentPlayer().goals.filter((goal) => goal.id !== el.dataset.id); if(!currentPlayer().goals.length) currentPlayer().goals.push(emptyGoal('')); touch(); render(); }));
  const toggleBtn = root.querySelector('[data-action="toggle-palmares-manager"]'); if(toggleBtn) toggleBtn.addEventListener('click', () => { palmaresManagerOpen = !palmaresManagerOpen; render(); });
  const clubInput = root.querySelector('#palmares-club-input'); if(clubInput) { clubInput.addEventListener('input', () => { state.activePalmaresClub = clubInput.value; touch(); }); clubInput.addEventListener('change', () => { state.activePalmaresClub = clubInput.value.trim() || 'Real Sociedad'; touch(); render(); }); }
  const syncBtn = root.querySelector('[data-action="sync-palmares-club"]'); if(syncBtn) syncBtn.addEventListener('click', () => { const clubName = (currentPlayer().currentClub || '').trim(); if(clubName){ state.activePalmaresClub = clubName; touch(); render(); } });
  const searchInput = root.querySelector('#palmares-search-input'); if(searchInput) searchInput.addEventListener('input', () => { const q = searchInput.value.trim().toLowerCase(); root.querySelectorAll('.clubrec-row').forEach((row) => { const nameInput = row.querySelector('[data-field="name"]'); const match = !q || (nameInput && nameInput.value.toLowerCase().includes(q)); row.style.display = match ? '' : 'none'; }); });
  const addClubrecBtn = root.querySelector('[data-action="add-clubrec"]'); if(addClubrecBtn) addClubrecBtn.addEventListener('click', () => { getClubRecords(computeViewClub()).push(emptyClubRecord('Nouveau joueur', 0, 0, 0)); touch(); render(); });
  root.querySelectorAll('[data-action="delete-clubrec"]').forEach((el) => el.addEventListener('click', () => { const club = computeViewClub(); state.clubsData[club] = getClubRecords(club).filter((rec) => rec.id !== el.dataset.id); touch(); render(); }));
  root.querySelectorAll('.clubrec-row').forEach((rowEl) => { const rec = getClubRecords(computeViewClub()).find((item) => item.id === rowEl.dataset.id); if(!rec) return; rowEl.querySelectorAll('[data-field]').forEach((input) => { input.addEventListener('input', () => { rec[input.dataset.field] = input.value; touch(); }); input.addEventListener('change', () => { rec[input.dataset.field] = input.value; touch(); render(); }); }); });
}
function bindPlayerInput(selector,field){ const input = document.querySelector(selector); if(!input) return; input.addEventListener('input', () => { currentPlayer()[field] = input.value; touch(); }); input.addEventListener('change', () => { currentPlayer()[field] = input.value; touch(); render(); }); }
function exportData(){ touch(); const blob = new Blob([JSON.stringify(getPayload(), null, 2)], { type: 'application/json' }); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'data.json'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
function importData(event){ const file = event.target.files && event.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = (ev) => { try{ applySharedData(JSON.parse(ev.target.result)); }catch(err){ alert("Ce fichier ne semble pas etre un export valide."); } }; reader.readAsText(file); }
async function loadFromRepo(event){ event.currentTarget.textContent = 'Chargement...'; try{ applySharedData(await fetchSharedData()); }catch(err){ alert("Impossible de trouver data.json a la racine du site. Verifie qu'il a bien ete ajoute au repo."); } event.currentTarget.textContent = 'Charger depuis le repo'; }
async function fetchSharedData(){ const response = await fetch('data.json', { cache: 'no-store' }); if(!response.ok) throw new Error('data.json introuvable'); return response.json(); }
function applySharedData(payload){ state = normalizePayload(Array.isArray(payload) ? { players: payload } : payload); save(); render(); }
function applySharedDataIfNewer(payload){ const incoming = normalizePayload(Array.isArray(payload) ? { players: payload } : payload); if(new Date(incoming.updatedAt).getTime() > new Date(state.updatedAt).getTime()){ state = incoming; save(); render(); } }
async function publishClick(event,syncStatus){
  const btn = event.currentTarget; btn.textContent = 'Publication...'; btn.disabled = true; syncStatus.className = 'sync-status';
  try{ await publishToGithub(); syncStatus.textContent = 'Donnees publiees. Les visiteurs verront la mise a jour apres rafraichissement.'; syncStatus.className = 'sync-status ok'; btn.textContent = 'Publie'; setTimeout(() => { btn.textContent = 'Publier sur le lien partage'; btn.disabled = false; }, 1800); }
  catch(err){ syncStatus.textContent = `Publication impossible : ${err.message || err}`; syncStatus.className = 'sync-status err'; btn.textContent = 'Publier sur le lien partage'; btn.disabled = false; }
}
async function publishToGithub(){
  const config = window.CARRIERE_SYNC || {}; if(!config.owner || !config.repo) throw new Error('Configure owner et repo dans sync-config.js');
  let token = localStorage.getItem(GITHUB_TOKEN_KEY); if(!token){ token = prompt('Token GitHub avec droit Contents: Read and write'); if(!token) throw new Error('token manquant'); localStorage.setItem(GITHUB_TOKEN_KEY, token); }
  const path = config.path || 'data.json'; const branch = config.branch || 'main'; const apiUrl = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${path}`; let sha = null;
  const current = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}`, { headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json' } }); if(current.ok) sha = (await current.json()).sha;
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(getPayload(), null, 2))));
  const response = await fetch(apiUrl, { method: 'PUT', headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }, body: JSON.stringify({ message: 'Update career data', content, branch, sha }) });
  if(!response.ok){ const body = await response.json().catch(() => ({})); throw new Error(body.message || 'erreur GitHub'); }
}
render();
fetchSharedData().then((payload) => HAD_SAVED_STATE ? applySharedDataIfNewer(payload) : applySharedData(payload)).catch(() => {});
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', (event) => { event.preventDefault(); deferredPrompt = event; document.getElementById('install-bar').classList.remove('hidden'); });
document.getElementById('install-btn').addEventListener('click', async () => { if(!deferredPrompt) return; deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; document.getElementById('install-bar').classList.add('hidden'); });
window.addEventListener('appinstalled', () => document.getElementById('install-bar').classList.add('hidden'));
</script>
